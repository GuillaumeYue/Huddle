services:
  server:
    build: ../backend
    image: huddle-backend
    env_file: ../backend/.env.production
    volumes:
      - ./certs/global-bundle.pem:/app/certs/global-bundle.pem:ro
    depends_on: [redis]
    restart: unless-stopped

  worker:
    image: huddle-backend
    command: ["node", "dist/worker.js"]
    env_file: ../backend/.env.production
    volumes:
      - ./certs/global-bundle.pem:/app/certs/global-bundle.pem:ro
    depends_on: [redis, server]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: